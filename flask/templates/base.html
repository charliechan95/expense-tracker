<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Expense Tracker{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">💰 Expense Tracker</div>
  <nav>
    <a href="{{ url_for('dashboard') }}"
       class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
    <a href="{{ url_for('expenses_page') }}"
       class="{% if request.path.startswith('/expenses') %}active{% endif %}">Expenses</a>
    <a href="{{ url_for('import_page') }}"
       class="{% if request.path.startswith('/import') %}active{% endif %}">Import</a>
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>

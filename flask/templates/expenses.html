{% extends "base.html" %}
{% block title %}Expenses — Expense Tracker{% endblock %}
{% block content %}
<h1>Expenses</h1>

<div class="toolbar">
  <form method="get" class="search" id="filter-form">
    <input type="text" id="f-q" placeholder="Search merchant…">
    <select id="f-platform">
      <option value="">All platforms</option>
      {% for p, label in platforms %}
      <option value="{{ p }}">{{ label }}</option>
      {% endfor %}
    </select>
    <select id="f-category">
      <option value="">All categories</option>
      {% for c in categories %}
      <option value="{{ c }}">{{ c }}</option>
      {% endfor %}
    </select>
    <input type="month" id="f-month">
    <button type="submit">Filter</button>
  </form>
  <button id="btn-new-expense" class="primary">+ Add expense</button>
</div>

<table class="tbl" id="expense-table">
  <thead><tr>
    <th>Date</th><th>Merchant</th><th>Category</th>
    <th>Platform</th><th>Amount</th><th></th>
  </tr></thead>
  <tbody id="expense-rows">
    <tr><td colspan="6" class="muted">Loading…</td></tr>
  </tbody>
</table>

<dialog id="dlg-expense">
  <form method="dialog" id="frm-expense">
    <h2>New expense</h2>
    <label>Amount <input type="number" step="0.01" min="0.01"
           name="amount" required></label>
    <label>Currency <input name="currency" value="CNY" maxlength="3"></label>
    <label>Date <input type="date" name="expense_date" id="f-date"
           required></label>
    <label>Category
      <select name="category">
        {% for c in categories %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Platform
      <select name="platform">
        {% for p, label in platforms %}
        <option value="{{ p }}">{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Merchant <input name="merchant"
           placeholder="e.g. Starbucks"></label>
    <label>Description <input name="description"></label>
    <div class="dlg-actions">
      <button type="submit" class="primary">Save</button>
      <button type="button" id="btn-cancel-expense">Cancel</button>
    </div>
  </form>
</dialog>
{% endblock %}
